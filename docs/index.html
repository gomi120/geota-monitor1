<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>거타 주작 사통팔달 모니터</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:900px;margin:0 auto;padding:20px;background:#f6f7f9;color:#171717}
    h1{font-size:24px}.meta{color:#666;margin-bottom:14px}.toolbar{position:sticky;top:0;background:#f6f7f9;padding:8px 0}
    input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #bbb;border-radius:10px;font-size:16px}
    .item{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin:10px 0}
    .nick{font-weight:700}.content{margin-top:5px}.time{color:#777;font-size:13px;margin-top:7px}
    .error{background:#fff0f0;border:1px solid #e3a0a0;padding:12px;border-radius:10px}
  </style>
</head>
<body>
  <h1>주작 서버 사통팔달</h1>
  <div id="meta" class="meta">불러오는 중…</div>
  <div class="toolbar"><input id="q" placeholder="닉네임 또는 내용 검색"></div>
  <div id="error"></div>
  <div id="list"></div>
<script>
let all = [];

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const rows = all.filter(x =>
    (x.nickname + " " + x.content).toLowerCase().includes(q)
  );

  document.getElementById("list").innerHTML = rows.map(x => `
    <div class="item">
      <div class="nick">${esc(x.nickname)}</div>
      <div class="content">${esc(x.content)}</div>
      <div class="time">${esc(x.displayTime || "")}</div>
    </div>
  `).join("");
}

fetch("./data.json?ts=" + Date.now())
  .then(r => {
    if (!r.ok) throw new Error("data.json을 불러오지 못했습니다.");
    return r.json();
  })
  .then(data => {
    all = Array.isArray(data.items) ? data.items : [];
    const at = data.collectedAt || data.lastAttemptAt;
    document.getElementById("meta").textContent =
      `최근 수집: ${at ? new Date(at).toLocaleString("ko-KR") : "없음"} · 보관 ${all.length}개`;

    if (data.ok === false) {
      document.getElementById("error").innerHTML =
        `<div class="error">최근 수집 실패: ${esc(data.error || "알 수 없는 오류")}</div>`;
    }
    render();
  })
  .catch(err => {
    document.getElementById("error").innerHTML =
      `<div class="error">${esc(err.message)}</div>`;
  });

document.getElementById("q").addEventListener("input", render);
</script>
</body>
</html>
